  <rect x="244" y="282" width="572" height="420" rx="44" fill="#ffffff" opacity="0.5"/>

  <!-- the image in view -->
  <rect x="194" y="334" width="636" height="452" rx="48" fill="#ffffff"/>
  <g clip-path="url(#photo)">
    <rect x="226" y="366" width="572" height="388" fill="url(#sky)"/>
    <circle cx="664" cy="470" r="50" fill="#fff6dc"/>
    <path d="M 196 754 L 392 538 L 486 640 L 586 516 L 830 754 Z" fill="#3d2a9c"/>
    <path d="M 392 538 L 486 640 L 586 516 L 830 754 L 600 754 Z" fill="#5a43c4"/>
