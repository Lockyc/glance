<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="glance app icon">
  <title>glance</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7457e0"/>
      <stop offset="1" stop-color="#3d2a9c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9466"/>
    </linearGradient>
    <clipPath id="photo"><rect x="226" y="366" width="572" height="388" rx="26"/></clipPath>
  </defs>

  <!-- macOS squircle tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#tile)"/>

  <!-- the folder behind: the next images, one arrow-key away -->
